<!doctype html><html lang="en" class="js"><head><meta charset="utf-8">
<base href="https://brilliantimpact-media.github.io/stonebrook-carpentry-website/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css?v=202611031649">
<style>
  html,body{margin:0;padding:0;background:transparent}
  :root{--header-h:0px}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(120,90,80,.35);border-radius:8px}
  body{overflow:hidden}.hero{min-height:100svh}
</style>
</head>
<body class="">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="p-circle" viewBox="0 0 200 80" preserveAspectRatio="none">
      <path pathLength="1" d="M34 13 C 88 -1, 176 5, 193 32 C 207 59, 141 77, 88 74 C 31 71, 2 57, 8 36 C 13 20, 48 8, 118 9"/>
    </symbol>
    <symbol id="p-underline" viewBox="0 0 200 20" preserveAspectRatio="none">
      <path pathLength="1" d="M3 13 C 52 5, 128 3, 197 9 M22 18 C 74 11, 140 10, 184 14"/>
    </symbol>
    <symbol id="p-one" viewBox="0 0 70 120"><path pathLength="1" d="M18 26 C 30 18, 38 10, 44 4 C 42 40, 40 80, 38 114"/></symbol>
    <symbol id="p-two" viewBox="0 0 90 120"><path pathLength="1" d="M10 34 C 12 8, 70 0, 72 32 C 74 58, 30 82, 8 112 C 34 108, 60 108, 86 110"/></symbol>
    <symbol id="p-three" viewBox="0 0 90 120"><path pathLength="1" d="M12 16 C 44 -2, 84 12, 58 46 C 50 54, 38 56, 32 56 C 92 54, 86 120, 10 104"/></symbol>
  </defs>
</svg>
<main><section class="hero">
  <img class="hero-bg" src="assets/img/hero-porch-front.jpg" srcset="assets/img/hero-porch-front-900.jpg 675w, assets/img/hero-porch-front.jpg 1125w" sizes="100vw" alt="" fetchpriority="high">
  <div class="hero-inner">
    <p class="hero-welcome rise" style="--d:.1s">Welcome to StoneBrook Carpentry.</p>
    <h1>
      <span class="rise" style="--d:.25s">Your Vision,</span>
      <span class="rise" style="--d:.4s">Beautifully <span class="pmark">Built.<svg class="pencil p-under"><use href="#p-underline"/></svg></span></span>
    </h1>
    <p class="hero-sub rise" style="--d:.55s">Honest, quality, reliable construction</p>
    <div class="hero-actions rise" style="--d:.7s">
      <a class="btn btn-tan" href="#estimate">Get Your Free Estimate</a>
      <a class="btn btn-ghost" href="#work">See Our Latest Work</a>
    </div>
  </div>
</section></main>
<script>
document.documentElement.classList.add('js');
(function(){
  try{document.querySelectorAll('svg.pencil').forEach(function(svg){Array.prototype.slice.call(svg.children).forEach(function(m){var g=m.cloneNode(true);g.classList.add('ghost');svg.appendChild(g);});});}catch(e){}
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t=new Set();
  document.querySelectorAll('[data-reveal]').forEach(function(e){t.add(e);});
  document.querySelectorAll('svg.pencil').forEach(function(s){if(s.parentElement)t.add(s.parentElement);});
  document.querySelectorAll('.wipe').forEach(function(w){t.delete(w);if(w.parentElement)t.add(w.parentElement);});
  function reveal(el){el.classList.add('in','drawn','m-in');el.querySelectorAll(':scope > .wipe').forEach(function(w){w.classList.add('in');});el.querySelectorAll('[data-count]').forEach(function(c){c.textContent=c.dataset.count;});}
  if('IntersectionObserver' in window && !reduce){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){reveal(e.target);io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:.12});
    t.forEach(function(el){io.observe(el);});
  } else { t.forEach(reveal); }
})();
</script>
</body></html>
