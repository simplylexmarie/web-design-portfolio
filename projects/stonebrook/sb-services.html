<body class="">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="p-circle" viewBox="0 0 200 80" preserveAspectRatio="none">

<main><section class="services" id="services">
  <div class="wrap services-grid">
    <div class="svc-list" data-reveal>
      <h2>What we <span class="pmark">build.<svg class="pencil p-circle"><use href="#p-circle"/></svg></span></h2>
      <span class="arrow arrow-curve arrow-svc" data-reveal aria-hidden="true"></span>
      <ul>
        <li><button class="svc active" data-img="assets/img/porch-stairs-side.jpg" data-alt="Cedar porch stairs and railings"><strong>Decks &amp; Porches</strong><span>Railings, stairs and covered porches framed for Wisconsin winters.</span></button></li>
        <li><button class="svc" data-img="assets/img/shower-blue-tile.jpg" data-alt="Custom tiled walk-in shower"><strong>Custom Tile</strong><span>Showers, floors and backsplashes, waterproofed before a single tile goes up.</span></button></li>
        <li><button class="svc" data-img="assets/img/vanity-wide.jpg" data-alt="Double vanity bathroom remodel"><strong>Kitchens &amp; Baths</strong><span>Vanities, cabinets, flooring and full remodels, finished cleanly.</span></button></li>
        <li><button class="svc" data-img="assets/img/basement.jpg" data-alt="Finished basement room"><strong>Basement Finishing</strong><span>Unused square footage turned into rooms your family actually uses.</span></button></li>
        <li><button class="svc" data-img="assets/img/patio-exterior.jpg" data-alt="Finished home exterior with balcony railing and stone patio"><strong>Additions &amp; Exteriors</strong><span>Additions, siding, trim and roofing tied in seamlessly with the house.</span></button></li>
        <li><button class="svc" data-img="assets/img/deck-structure.jpg" data-alt="Heavy timber deck framing"><strong>Repairs Done Right</strong><span>Rotted framing, sagging floors and failing decks fixed properly, not covered up.</span></button></li>

      <img class="svc-img" src="assets/img/porch-stairs-side.jpg" alt="Cedar porch stairs and railings">
    </figure>
  </div>
</section></main>
<script>
(function(){var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var svcMedia=document.querySelector('.svc-media'),svcs=Array.prototype.slice.call(document.querySelectorAll('.svc'));
if(!svcMedia||!svcs.length)return;var tilts=[-2.5,2,-1.2,2.6,-2,1.4];svcMedia.innerHTML='';
var photos=svcs.map(function(b,i){var img=document.createElement('img');img.className='stack-photo'+(i===0?' in':'');img.src=b.dataset.img;img.alt=b.dataset.alt||'';img.style.setProperty('--tilt',tilts[i%tilts.length]+'deg');img.style.zIndex=i+1;svcMedia.appendChild(img);return img;});
var active=0;function activate(btn){var n=svcs.indexOf(btn);if(n===active)return;svcs.forEach(function(b){b.classList.toggle('active',b===btn);});var up=n>active;
photos.forEach(function(ph,i){var on=i<=n;if(on===ph.classList.contains('in'))return;var delay=up?(i-active-1)*90:(active-i)*90;ph.style.transitionDelay=Math.max(0,delay)+'ms';ph.classList.toggle('in',on);});active=n;}
svcs.forEach(function(btn){btn.addEventListener('mouseenter',function(){activate(btn);});btn.addEventListener('focus',function(){activate(btn);});btn.addEventListener('click',function(){activate(btn);});});})();
</script><script>
document.documentElement.classList.add('js');
(function(){
  try{document.querySelectorAll('svg.pencil').forEach(function(svg){Array.prototype.slice.call(svg.children).forEach(function(m){var g=m.cloneNode(true);g.classList.add('ghost');svg.appendChild(g);});});}catch(e){}
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t=new Set();
  document.querySelectorAll('[data-reveal]').forEach(function(e){t.add(e);});
  document.querySelectorAll('svg.pencil').forEach(function(s){if(s.parentElement)t.add(s.parentElement);});
  document.querySelectorAll('.wipe').forEach(function(w){t.delete(w);if(w.parentElement)t.add(w.parentElement);});
  function reveal(el){el.classList.add('in','drawn','m-in');el.querySelectorAll(':scope > .wipe').forEach(function(w){w.classList.add('in');});el.querySelectorAll('[data-count]').forEach(function(c){c.textContent=c.dataset.count;});}
  if('IntersectionObserver' in window && !reduce){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){reveal(e.target);io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:.12});
    t.forEach(function(el){io.observe(el);});
  } else { t.forEach(reveal); }
})();
</script><script>
(function(){var last=0;function post(){var h=Math.ceil(document.documentElement.scrollHeight);if(Math.abs(h-last)<2)return;last=h;try{parent.postMessage({shFrame:(location.pathname.split('/').pop()||''),shHeight:h},'*');}catch(e){}}
addEventListener('load',post);addEventListener('resize',post);
if(window.ResizeObserver){new ResizeObserver(post).observe(document.body);}
setTimeout(post,200);setTimeout(post,800);setTimeout(post,1800);
document.addEventListener('click',function(){setTimeout(post,60);setTimeout(post,500);});})();
</script>
